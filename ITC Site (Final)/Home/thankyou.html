<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARP Knots - Thank You!</title>
  <style>
    :root {
      --header: #4B3830;
      --hero-bg: #F4E7C9;
      --logo: #FEFDF9;
      --icon: #6F4E37;
      --categories: #DCC8AA;
      --footer-left: #b72b2d;
      --footer-right: #c96060;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #F4E7C9; color: #222; }

    /* Header */
    .header {
      height: 111px;
      background: var(--header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 19px;
    }
    .logo {
      width: 300px;
      height: auto;
    }

    .icon {
		width: 100px;
		height: auto;
	}

    /* Hero */
    .hero {
      background: var(--hero-bg);
      height: 750px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .hero-media {
	  position: relative;
      width: 100%;
      max-width: 100%;
      height: 100%;
      background: var(--categories);
	  font-family: Georgia, "Times New Roman", serif;
	  display: flex;
	  flex-direction: column;
      align-items: center;
      justify-content: center;
	  font-size: large;
	  color: white;
    }
	
	.btn {
		margin-top: auto;
		}

    /* Intro block */
    .intro {
      display: flex;
      justify-content: center;
      padding: 44px 20px 65px;
	  background: var(--icon);
	  width: 98%;
	  height: auto;
	  margin: 10px;
	  margin-bottom: auto;
    }
    .intro-text {
      width: 631px;
      max-width: 100%;
      background: var(--icon);
	  text-align: center;
    }

    /* Card grid */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 288px);
      justify-content: center;
      column-gap: 9px;
      row-gap: 10px;
      padding-bottom: 60px;
    }
    .card { height: 261px; background: var(--categories); font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; color: black;}
	
	.card_img {
	  width: 150%;
	  background-color: #6F4E37;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  padding: 16px;
	  box-sizing: border-box;
	  border-radius: 10px;
	  float: right;
	  margin: 10px;
	}

	.full_logo {
	  display: block;
	  max-width: 200%;
	  width: 100%;
	  height: auto;
	}

    /* Footer */
    .footer {
      height: 139px;
      background: var(--gray);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 38px;
    }
    .footer-left  { width: 277px; max-width: 45%; height: 61px; background: var(--logo); }
    .footer-right { width: 252px; max-width: 45%; height: 71px; background: var(--logo); }

    @media (max-width: 720px) {
      .hero { height: auto; padding: 40px 20px; }
      .hero-media { height: 220px; }
      .cards { grid-template-columns: minmax(0, 288px); row-gap: 20px; }
    }
  </style>
</head>
<body>
	<script>
		{
			sessionStorage.removeItem("cart");
		}
	</script>
  <header class="header">
    <div>
		  <a href="../Home/index.html"><img src="https://drive.google.com/thumbnail?id=12eeSFIIr-Ku99ltgB41j4qXlS_pp0s76&sz=w1000" alt="Logo" class="logo"></a>
	</div>
    <div>
		<a href="https://www.facebook.com/profile.php?id=61581272267772"><img src="../Images/ico-removebg-preview.png" alt="Facebook" class="icon"></a>
	</div>
	
  </header>

  <section class="hero">
    <div class="hero-media">
		<section class="intro">
			<div class="intro-text"><h1>Thank you for ordering!</h1></div>
		</section>
		 <main class="cards">
		<div class="card">
			<p>Every stitch is made by hand between classes, study sessions, and late-night hooks. Your support means the world—we're getting your yarn and order ready with care!</p>
		</div>
		<div class="card_img">
		<img src="../Images/istockphoto-2177556442-612x612.jpg" alt="logo" class="full_logo">
	</div>
  </main>
	</div>
  </section>
</body>
</html>
