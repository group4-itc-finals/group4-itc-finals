<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product List</title>
<style>
  :root {
    --bg: #fffef9;
    --gray: #d9d9d9;
    --logo: #c95a58;
    --icon: #e5827e;
    --image: #dc8d8d;
    --footer-left: #b82c2c;
    --footer-right: #c96060;
    --text: #333333;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .site-header {
    background: var(--gray);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px;
  }
  .logo {
    background: var(--logo);
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    padding: 8px 14px;
    min-width: 124px;
  }
  .icon-btn {
    background: var(--icon);
    border: 0;
    width: 26px;
    height: 26px;
    cursor: pointer;
  }

  /* Main: sorting list (left) + product list (right) */
  main {
    flex: 1;
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 22px;
    display: grid;
    grid-template-columns: minmax(180px, 1fr) 2.75fr;
    gap: 35px;
    align-items: start;
  }

  /* Sorting list */
  .sorting {
    background: var(--gray);
    padding: 16px;
    min-height: 356px;
  }
  .sorting h2 {
    margin: 0 0 12px;
    font-size: 16px;
  }
  .sorting ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .sorting li { margin-bottom: 10px; }
  .sorting label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    cursor: pointer;
  }

  /* Product list */
  .products {
    background: var(--gray);
    padding: 16px;
    min-height: 356px;
  }
  .product-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .product-card {
    background: var(--bg);
    padding: 12px;
  }
  .product-card a {
    color: inherit;
    text-decoration: none;
    display: block;
  }
  .product-image {
    background: var(--image);
    aspect-ratio: 4 / 3;
    width: 100%;
    /* Replace with an <img> when you have one */
  }
  .product-name {
    margin: 10px 0 4px;
    font-size: 14px;
    font-weight: 700;
  }
  .product-price {
    margin: 0;
    font-size: 14px;
  }

  /* Footer */
  .site-footer {
    background: var(--gray);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 15px;
  }
  .footer-left {
    background: var(--footer-left);
    color: #fff;
    text-decoration: none;
    padding: 4px 12px;
    min-width: 112px;
    font-size: 13px;
  }
  .footer-right {
    background: var(--footer-right);
    color: #fff;
    text-decoration: none;
    padding: 6px 14px;
    min-width: 101px;
    text-align: center;
    font-size: 13px;
  }

  /* Stack on small screens */
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; gap: 20px; padding: 20px 16px; }
    .sorting, .products { min-height: 0; }
  }
</style>
</head>
<body>

  <header class="site-header">
    <a class="logo" href="#">Logo</a>
    <button class="icon-btn" type="button" aria-label="Menu"></button>
  </header>

  <main>

    <aside class="sorting" aria-label="Sort products">
      <h2>Sort by</h2>
      <ul>
        <li><label><input type="radio" name="sort" value="featured" checked> Featured</label></li>
        <li><label><input type="radio" name="sort" value="price-asc"> Price: Low to High</label></li>
        <li><label><input type="radio" name="sort" value="price-desc"> Price: High to Low</label></li>
        <li><label><input type="radio" name="sort" value="newest"> Newest</label></li>
        <li><label><input type="radio" name="sort" value="name"> Name: A to Z</label></li>
      </ul>
    </aside>

    <section class="products" aria-label="Products">
      <ul class="product-grid">
        <li class="product-card"><a href="#"><div class="product-image"></div><p class="product-name">Product Name</p><p class="product-price">$00.00</p></a></li>
        <li class="product-card"><a href="#"><div class="product-image"></div><p class="product-name">Product Name</p><p class="product-price">$00.00</p></a></li>
        <li class="product-card"><a href="#"><div class="product-image"></div><p class="product-name">Product Name</p><p class="product-price">$00.00</p></a></li>
        <li class="product-card"><a href="#"><div class="product-image"></div><p class="product-name">Product Name</p><p class="product-price">$00.00</p></a></li>
        <li class="product-card"><a href="#"><div class="product-image"></div><p class="product-name">Product Name</p><p class="product-price">$00.00</p></a></li>
        <li class="product-card"><a href="#"><div class="product-image"></div><p class="product-name">Product Name</p><p class="product-price">$00.00</p></a></li>
      </ul>
    </section>

  </main>

  <footer class="site-footer">
    <a class="footer-left" href="#">Footer link</a>
    <a class="footer-right" href="#">Footer button</a>
  </footer>

</body>
</html>
