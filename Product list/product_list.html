<!DOCTYPE html>
<html lang="en">
<head>
<title>ARP Knots - Product List</title>
<style>
  :root {
    --bg: #F4E7C9;
    --gray: #dcc7aa;
    --logo: #c95a58;
    --icon: #4B3830;
    --image: #dc8d8d;
    --footer-left: #b82c2c;
    --footer-right: #c96060;
    --text: #333333;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .site-header {
	height: 111px;
    background: var(--icon);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px;
  }
  .logo {
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    padding: 8px 14px;
    width: 300px;
	height: auto;
  }
  
  .cart{
	width: 100px;
	height: auto;
	}
  
  .icon-btn {
    background: var(--bg);
    border: 0;
    width: 26px;
    height: 26px;
    cursor: pointer;
  }
  
  .icon {
		width: 100px;
		height: auto;
	}

  /* Main stretches between header and footer, centering products vertically */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 24px 0;
  }

  /* Product list */
  .products {
    width: 100%;
    background: var(--gray);
    padding: 16px;
  }
  .product-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .product-card {
    background: var(--bg);
    padding: 12px;
  }
  .product-card a {
    color: inherit;
    text-decoration: none;
    display: block;
  }
  .product-image {
    background: var(--image);
    aspect-ratio: 4 / 3;
    width: 100%;
    overflow: hidden;
  }
  .product-image img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .product-name {
    margin: 10px 0 4px;
    font-size: 14px;
    font-weight: 700;
  }
  .product-price {
    margin: 0;	
    font-size: 14px;
  }

  /* Footer */
  .site-footer {
    background: var(--icon);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 15px;
  }
  .footer-left {
    background: var(--footer-left);
    color: #fff;
    text-decoration: none;
    padding: 4px 12px;
    min-width: 112px;
    font-size: 13px;
  }
  .footer-right {
    background: var(--footer-right);
    color: #fff;
    text-decoration: none;
    padding: 6px 14px;
    min-width: 101px;
    text-align: center;
    font-size: 13px;
  }

  /* Stack on small screens */
  @media (max-width: 800px) {
    main {
      align-items: stretch;
      padding: 16px;
    }
    .product-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }
  }
</style>
</head>
<body>

  <header class="site-header">
    <a href="../index.html"><img src="https://drive.google.com/thumbnail?id=12eeSFIIr-Ku99ltgB41j4qXlS_pp0s76&sz=w1000" alt="Logo" class="logo"></a>
    <a href="../Cart/Cart.html"><img src="https://uxwing.com/wp-content/themes/uxwing/download/e-commerce-currency-shopping/shopping-cart-white-icon.png" alt="Cart" class="cart"></a>
  </header>

  <main>
    <section class="products" aria-label="Products">
      <ul class="product-grid">
        <li class="product-card"><a href="../Product page/Stingy.html"><div class="product-image"><img src="../Images/Screenshot 2026-11-22 160518.png"></div><p class="product-name">Stingy</p><p class="product-price">₱40.00</p></a></li>
        <li class="product-card"><a href="../Product page/Whale Puff.html"><div class="product-image"><img src="../Images/Screenshot 2026-11-22 160552.png"></div><p class="product-name">Whale Puffs</p><p class="product-price">₱30.00</p></a></li>
        <li class="product-card"><a href="../Product page/commission.html"><div class="product-image"><img src="../Images/Screenshot 2026-11-22 160621.png"></div><p class="product-name">Commissioned Design</p><p class="product-price">Price varies</p></a></li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <a href="../index.html"><img src="https://drive.google.com/thumbnail?id=12eeSFIIr-Ku99ltgB41j4qXlS_pp0s76&sz=w1000" alt="Logo" class="logo"></a>
	<a href="https://www.facebook.com/profile.php?id=61581272267772"><img src="../Images/ico-removebg-preview.png" alt="Facebook" class="icon"></a>
  </footer>

</body>
</html>
