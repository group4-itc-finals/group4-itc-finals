<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARP Knots - Checkout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F4E7C9;
      --panel: #DCC8AA;
      --red-main: #4B3830;
      --red-light: #e5807a;
      --red-dark: #b82b2b;
      --red-muted: #955c5c;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Header ---------- */
    .site-header {
      background: var(--red-main);
      height: 72px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
	
    .logo { width: 160px; height: 37px; }
    .menu { width: 33px; height: 30px; }
	
	.cart{
	width: 100%;
	height: 100%;
	}
	
	.icon {
		width: 50px;
		height: auto;
	}
	
    }
    .header-action {
      width: 40px;
      height: 36px;
      background: var(--red-light);
    }

    /* ---------- Main ---------- */
    .checkout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr);
      gap: 36px;
      align-items: start;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 48px 40px 64px;
    }

    .panel {
      background: var(--panel);
    }

    /* left column: shorter box (order summary) */
    .summary {
      min-height: 400px;
	  padding: 10px;
    }

    /* right column: taller box (payment / details) with CTA pinned to bottom */
    .details {
      height: auto;
      display: flex;
      flex-direction: column;
      padding: 56px 32px 24px;
	  
    }
    .cta {
      width: 100%;
      height: 54px;
      border: 0;
      background: var(--red-muted);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
	  margin-top: auto;
    }
		
    .cta:hover { filter: brightness(1.1); }

    /* ---------- Footer ---------- */
     footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 68px;
      padding: 0 18px 0 21px;
      background: var(--red-main);
    }
   

    /* ---------- Responsive ---------- */
    @media (max-width: 800px) {
      .checkout { grid-template-columns: 1fr; padding: 24px 16px 40px; }
      .details { min-height: 420px; }
      .summary { min-height: 240px; }
      .logo { width: 120px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="logo" aria-label="Logo"><a href="../Home/index.html"><img src="https://drive.google.com/thumbnail?id=12eeSFIIr-Ku99ltgB41j4qXlS_pp0s76&sz=w1000" alt="Logo" class="logo"></a></div>
    <div class="menu" aria-label="Menu"><a href="../Cart/Cart.html"><img src="https://uxwing.com/wp-content/themes/uxwing/download/e-commerce-currency-shopping/shopping-cart-white-icon.png" alt="Cart" class="cart"></a></div>
  </header>

  <main class="checkout">
    <section class="panel summary" aria-label="Order summary" id="checkout-items">
		<script>
			{
			  const container = document.getElementById("checkout-items");
			  const totalEl = document.getElementById("checkout-total");
			  const cart = JSON.parse(sessionStorage.getItem("cart")) || [];

			  if (container) {
				const heading = "<h2>Order Summary</h2>";

				if (cart.length === 0) {
				  container.innerHTML = `${heading}<p>No items to check out.</p>`;
				  if (totalEl) totalEl.textContent = "₱0.00";
				} else {
				  const itemsHtml = cart
					.map(item => {
					  const price = Number(item.price) || 0;
					  const qty = Number(item.quantity) || 1;
					  const subtotal = price * qty;

					  const optionsText = Object.entries(item.options || {})
						.map(([key, val]) => `${key}: ${val}`)
						.join(", ");

					  return `
						<div class="checkout-item">
						  <h3>${item.name || "Item"}</h3>
						  ${optionsText ? `<p>${optionsText}</p>` : ""}
						  <p>Price: ₱${price.toFixed(2)}</p>
						  <p>Qty: ${qty}</p>
						  <p>Subtotal: ₱${subtotal.toFixed(2)}</p>
						</div>
					  `;
					})
					.join("");

				  const grandTotal = cart.reduce((sum, item) => {
					const price = Number(item.price) || 0;
					const qty = Number(item.quantity) || 1;
					return sum + price * qty;
				  }, 0);

				  container.innerHTML = `
					${heading}
					${itemsHtml}
					<p id="cart-total">Grand Total: ₱${grandTotal.toFixed(2)}</p>
				  `;

				  if (totalEl) {
					totalEl.textContent = `₱${grandTotal.toFixed(2)}`;
				  }
				}
			  }
			}
		</script>
	</section>

    <section class="panel details" aria-label="Contact Information">
		<h2>Contact Info</h2><br>
		<form id="checkout-form">
			<label for="name">Name:</label>
			<input type="text" id="name" required><br><br>
			<label for="phone_number">Phone Number:</label>
			<input type="tel" id="phone_number" inputmode="tel" pattern="^(\+63|0)9\d{9}$" required><br><br>
			<label for="address">Address:</label>
			<input type="text" id="address" required><br><br>
			<label for="email">E-mail Address:</label>
			<input type="email" id="email" required><br><br>
			<button class="cta" type="submit">Place order</button>
		</form>
    <script>
		{
		  const checkoutForm = document.getElementById("checkout-form");
		  if (checkoutForm) {
			checkoutForm.addEventListener("submit", e => {
			  e.preventDefault();
			  if (!checkoutForm.checkValidity()) {
				checkoutForm.reportValidity();
				return;
			  }
			  window.location.href = "../Home/thankyou.html";
			});
		  }
		}
	</script>
    </section>
  </main>

  <footer>
     <div class="logo" aria-label="Logo"><a href="../Home/index.html"><img src="https://drive.google.com/thumbnail?id=12eeSFIIr-Ku99ltgB41j4qXlS_pp0s76&sz=w1000" alt="Logo" class="logo"></a></div>
    <div><a href="https://www.facebook.com/profile.php?id=61581272267772"><img src="../Images/ico-removebg-preview.png" alt="Facebook" class="icon"></a></div>
  </footer>

</body>
</html>
