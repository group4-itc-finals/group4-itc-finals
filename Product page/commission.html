<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARP Knots - Commission</title>
  <style>
    :root {
      --bg: #F4E7C9;
      --gray: #dcc7aa;
      --red: #c95a5a;
      --red-light: #e08080;
      --pink: #e5827e;
      --header: #4B3830;
      --red-dark: #6F4E37;
      --red-mid: #c96262;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      justify-content: space-between;	
      align-items: center;
      height: 52px;
      padding: 0 10px;
      background: var(--header);
    }
    .logo { width: 146px; height: 35px;}
	.icon {
		width: 50px;
		height: auto;
	}
    .menu { width: 31px; height: 28px;}
	.cart{
	width: 100%;
	height: 100%;
	}

    /* ---------- Main ---------- */
    main {
      flex: 1;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 33px 40px 40px;
    }

    .product {
      display: grid;
      grid-template-columns: 261px 1fr;
      gap: 47px;
      align-items: start;
    }

    /* Gallery */
    .gallery {
      background: var(--gray);
      padding: 13px 20px 24px;
    }
    .gallery-main {
      width: 100%;
      height: 216px;
      background: var(--pink);
    }
	
	.gallery-main img{
		width: 100%;
		height: 100%;
	}

    /* Details */
    .details { max-width: 224px; width: 100%; }
    .bar { background: var(--gray); }
    .title    { height: 25px; margin-top: 13px; text-align: center;}
    .subtitle { height: 19px; width: 142px; margin-top: 10px; text-align: center;}
    .price    { height: 42px; margin-top: 22px; text-align: center;}

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 59px;
    }
    .btn {
      width: 91px;
      height: 30px;
      border: 0;
      background: var(--gray);
      cursor: pointer;
    }
	
	.btn2{
	  width: 91px;
      height: 30px;
      border: 0;
      background: var(--red-dark);
      cursor: pointer;
	  color: white;
    }
    .btn:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

    /* Description */
    .description {
      height: 372px;
      margin-top: 17px;
      background: var(--gray);
	  padding: 10px;
    }

    /* ---------- Footer ---------- */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 58px;
      padding: 0 18px;
      background: var(--header);
    }
    .footer-left  { width: 131px; height: 28px; background: var(--red-dark); border: 0; cursor: pointer; }
    .footer-right { width: 120px; height: 33px; background: var(--red-mid);  border: 0; cursor: pointer; }
    footer button:focus-visible { outline: 3px solid #000; outline-offset: 2px; }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {
      main { padding: 24px 20px; }
      .product { grid-template-columns: 1fr; gap: 24px; }
      .details { max-width: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" aria-label="Logo"><a href="../index.html"><img src="https://drive.google.com/thumbnail?id=12eeSFIIr-Ku99ltgB41j4qXlS_pp0s76&sz=w1000" alt="Logo" class="logo"></a></div>
    <div class="menu" aria-label="Menu"><a href="../Cart/Cart.html"><img src="https://uxwing.com/wp-content/themes/uxwing/download/e-commerce-currency-shopping/shopping-cart-white-icon.png" alt="Cart" class="cart"></a></div>
  </header>

  <main>
    <section class="product">
      <div class="gallery">
        <div class="gallery-main" aria-label="Main product image"><img src="../Images/Screenshot 2026-11-22 160621.png"></div><p class="product-name"></div>
      </div>

      <div class="details">
        <div class="bar title" aria-label="Product title" id="product-name"><strong>Commissioned Design</strong></div>
        <div class="bar subtitle" aria-label="Price" id="product-price"><p>Price varies</p></div>
        <div class="bar price" aria-label="Price">
			<strong>Please fill out the form below.</strong>
		</div>
      </div>
    </section>

    <section class="description" aria-label="Description">
		<form>
			<label for="item_name">What is the name of the design you would like us to make?</label><br>
			<input type="text" id="item_name" required><br>
			<label for="ref">Upload a picture below as a reference.</label><br>
			<input type="file" id="ref" name="image" accept="image/png, image/jpg, image/webp" required><br>
			<label for="desc">Please indicate or at least give a baseline on how large you want it to be made, price will vary depending on this.</label><br>
			<textarea id="desc" placeholder="Provide a description."required></textarea><br>
			<label for="email">Please enter an email address so we can contact you.</label><br>
			<input type="email" id="email" required><br><br>
			<input type="submit" value="Submit">
		</form>
	</section>
  </main>

  <footer>
    <div class="logo" aria-label="Logo"><a href="../index.html"><img src="https://drive.google.com/thumbnail?id=12eeSFIIr-Ku99ltgB41j4qXlS_pp0s76&sz=w1000" alt="Logo" class="logo"></a></div>
    <div><a href="https://www.facebook.com/profile.php?id=61581272267772"><img src="../Images/ico-removebg-preview.png" alt="Facebook" class="icon"></a></div>
  </footer>
</body>
</html>
