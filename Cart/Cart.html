<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARP Knots - Cart</title>
  <style>
    :root {
      --bg: #F4E7C9;
      --gray: #DCC8AA;
      --red: #c95a5a;
      --red-light: #e08080;
      --red-muted: #955c5c;
      --red-dark: #4B3830;
      --red-mid: #c96262;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
	
	.cart{
	width: 100%;
	height: 100%;
	}
	
	.icon {
		width: 50px;
		height: auto;
	}

    /* ---------- Header ---------- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 56px;
      padding: 0 6px 0 11px;
      background: var(--red-dark);
    }
    .logo { width: 160px; height: 37px; }
    .menu { width: 33px; height: 30px; }

    /* ---------- Main ---------- */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 309fr 268fr;
      gap: 30px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 31px 28px 28px 30px;
    }

    .left {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .search   { height: 24px; background: var(--gray); text-align: center;}
    .content  { flex: 1; min-height: 394px; background: var(--gray); padding: 10px;}

    .panel {
      position: relative;
      min-height: 440px;
      margin-top: 2px;
      background: var(--gray);
	  padding: 10px;
    }
    .panel-btn {
      position: absolute;
      left: 38px;
      right: 38px;
      bottom: 33px;
      height: 39px;
      border: 0;
      background: var(--red-muted);
      cursor: pointer;
	  color: white;
    }
    .panel-btn:focus-visible { outline: 3px solid #000; outline-offset: 2px; }

    /* ---------- Footer ---------- */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 68px;
      padding: 0 18px 0 21px;
      background: var(--red-dark);
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {
      main { grid-template-columns: 1fr; padding: 20px; }
      .panel { margin-top: 0; }
    }
  </style>
</head>
<body>

  <header>
   <div class="logo" aria-label="Logo"><a href="../index.html"><img src="https://drive.google.com/thumbnail?id=12eeSFIIr-Ku99ltgB41j4qXlS_pp0s76&sz=w1000" alt="Logo" class="logo"></a></div>
    <div class="menu" aria-label="Menu"><a href="#"><img src="https://uxwing.com/wp-content/themes/uxwing/download/e-commerce-currency-shopping/shopping-cart-white-icon.png" alt="Cart" class="cart"></a></div>
  </header>

  <main>
    <section class="left">
      <div class="search" aria-label="Search or title bar"><strong>Order Summary</strong></div>
      <div class="content" aria-label="Main content" id="cart-items">
		<script>
			{
  const container = document.getElementById("cart-items");

  function renderCart() {
    if (!container) return;

    const cart = JSON.parse(sessionStorage.getItem("cart")) || [];

    if (cart.length === 0) {
      container.innerHTML = "<p>Your cart is empty.</p>";
      return;
    }

    const itemsHtml = cart
      .map((item, index) => {
        const price = Number(item.price) || 0;
        const qty = Number(item.quantity) || 1;
        const subtotal = price * qty;

        const optionsText = Object.entries(item.options || {})
          .map(([key, val]) => `${key}: ${val}`)
          .join(", ");

        return `
          <div class="cart-item">
            <h3>${item.name || "Item"}</h3>
            ${optionsText ? `<p>${optionsText}</p>` : ""}
            <p>Qty: ${qty}</p>
            <p>Subtotal: ₱${subtotal.toFixed(2)}</p>
            <button type="button" class="remove-item" data-index="${index}">Remove</button>
          </div>
        `;
      })
      .join("");

    const grandTotal = cart.reduce((sum, item) => {
      const price = Number(item.price) || 0;
      const qty = Number(item.quantity) || 1;
      return sum + price * qty;
    }, 0);

    container.innerHTML = `
      ${itemsHtml}
      <p id="cart-total">Grand Total: ₱${grandTotal.toFixed(2)}</p>
    `;
  }

  if (container) {
    container.addEventListener("click", e => {
      const removeBtn = e.target.closest(".remove-item");
      if (!removeBtn) return;

      const index = Number(removeBtn.dataset.index);
      const cart = JSON.parse(sessionStorage.getItem("cart")) || [];

      if (!Number.isNaN(index) && index >= 0 && index < cart.length) {
        cart.splice(index, 1);
        sessionStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }
    });

    renderCart();
  }
}
		</script>
	  </div>
    </section>

    <aside class="panel" aria-label="Side panel" id="payment-details">
		<script>
			{
			  const container = document.getElementById("payment-details");
			  const cart = JSON.parse(sessionStorage.getItem("cart")) || [];

			  if (container) {
				if (cart.length === 0) {
				  container.innerHTML = "<h3>Payment Details</h3><p>Your cart is empty.</p>";
				} else {
				  const subtotalsHtml = cart
					.map(item => {
					  const price = Number(item.price) || 0;
					  const qty = Number(item.quantity) || 1;
					  const subtotal = price * qty;
					  return `<p>Subtotal: ₱${subtotal.toFixed(2)}</p>`;
					})
					.join("");

				  const grandTotal = cart.reduce((sum, item) => {
					const price = Number(item.price) || 0;
					const qty = Number(item.quantity) || 1;
					return sum + price * qty;
				  }, 0);

				  container.innerHTML = `
					<h3>Payment Details</h3>
					${subtotalsHtml}
					<p id="cart-total">Grand Total: ₱${grandTotal.toFixed(2)}</p>
				  `;
				}
			  }
			}
		</script>
      <button class="panel-btn" type="button" aria-label="Panel action" onclick="window.location.href='../checkout/checkout.html';">Proceed to Checkout</button>
    </aside>
  </main>

  <footer>
    <div class="logo" aria-label="Logo"><a href="../index.html"><img src="https://drive.google.com/thumbnail?id=12eeSFIIr-Ku99ltgB41j4qXlS_pp0s76&sz=w1000" alt="Logo" class="logo"></a></div>
    <div><a href="https://www.facebook.com/profile.php?id=61581272267772"><img src="../Images/ico-removebg-preview.png" alt="Facebook" class="icon"></a></div>
  </footer>

</body>
</html>
